name: Deploy to Elastic Beanstalk

# Deploys automatically on every push to main. It can also still be run
# manually from the "Run workflow" dropdown to deploy another branch or
# override the target EB environment/region below.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Elastic Beanstalk environment name'
        required: true
        default: 'kisar-backend-prod'
      region:
        description: 'AWS region'
        required: true
        default: 'ap-south-1'

permissions:
  contents: read

concurrency:
  group: eb-deploy-${{ inputs.environment_name || 'kisar-backend-prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # git archive only includes tracked files, so node_modules/.env/uploads
      # (all gitignored) are excluded automatically - EB installs deps itself.
      - name: Build deployment package
        run: git archive --format=zip --output=deploy.zip HEAD

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: kisar-backend
          environment_name: ${{ inputs.environment_name || 'kisar-backend-prod' }}
          region: ${{ inputs.region || 'ap-south-1' }}
          version_label: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          deployment_package: deploy.zip
          wait_for_environment_recovery: 300
